# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> wskaż to repozytorium. Sekrety (sync: false) wpisujesz w panelu Render.
services:
  - type: web
    name: zuzlowy-typer
    runtime: node
    plan: free                # starter = bez usypiania; wtedy zadania w tle działają same
    region: frankfurt         # najbliżej Polski
    branch: main
    # --include=dev: Tailwind jest w devDependencies, a przy NODE_ENV=production samo `npm ci` by go pominęło
    buildCommand: npm ci --include=dev && npm run build:css
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Warsaw
      - key: MONGODB_URI          # MongoDB Atlas (darmowy klaster M0), region Frankfurt
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET          # losowy sekret dla /api/cron/run (GitHub Actions)
        generateValue: true
      # Klucze push (VAPID) serwer generuje sam przy pierwszym starcie i trzyma w bazie.
      # Własne (npm run vapid) dodasz w Environment jako VAPID_PUBLIC_KEY i VAPID_PRIVATE_KEY.
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # Źródła wyników ustawiasz w panelu admina (Sezon -> Wyniki auto) albo w zmiennej SCRAPER_URLS.
      - key: SCRAPE_INTERVAL_MINUTES
        value: "60"
      - key: REMINDER_MINUTES
        value: "120"
      - key: LEGACY_SEASON
        value: "2026"
