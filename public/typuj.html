<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twój panel typera</title>
    <meta name="robots" content="noindex">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 pb-32">

    <div class="container mx-auto p-3 max-w-lg">

        <!-- KARTA GRACZA -->
        <div class="bg-blue-900 text-white rounded-2xl shadow-2xl overflow-hidden mb-4">
            <div class="p-5 flex justify-between items-start gap-3">
                <div class="min-w-0">
                    <h1 id="p-nick" class="text-2xl font-black truncate">Wczytywanie...</h1>
                    <div id="p-chasing" class="text-[10px] text-blue-300 font-bold uppercase mt-1"></div>
                    <div id="p-season" class="text-[10px] text-blue-400 font-bold uppercase mt-0.5"></div>
                </div>
                <a href="/" title="Strona główna" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg transition-colors shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </a>
            </div>
            <div class="grid grid-cols-4 gap-px bg-white/10 border-t border-white/10 text-center">
                <div class="p-3"><div class="text-[10px] text-blue-300 uppercase font-bold">Miejsce</div><div id="p-rank" class="text-lg font-black">-</div></div>
                <div class="p-3 bg-white/5"><div class="text-[10px] text-blue-300 uppercase font-bold">Punkty</div><div id="p-pts" class="text-lg font-black">-</div></div>
                <div class="p-3"><div class="text-[10px] text-blue-300 uppercase font-bold">Snajper</div><div id="p-snipers" class="text-lg font-black">-</div></div>
                <div class="p-3 bg-white/5"><div class="text-[10px] text-blue-300 uppercase font-bold">Śr./mecz</div><div id="p-avg" class="text-lg font-black">-</div></div>
            </div>
        </div>

        <!-- ZEGAR BLOKADY -->
        <div class="bg-white p-3 rounded-xl shadow-sm mb-4 flex items-center justify-between border-l-4 border-red-500">
            <div>
                <div class="text-[10px] font-bold text-gray-400 uppercase">Do najbliższej blokady</div>
                <div id="countdown-match" class="text-[10px] text-gray-500"></div>
            </div>
            <span id="countdown" class="font-mono text-lg font-black text-red-600">--:--:--</span>
        </div>

        <!-- BRAKUJĄCE TYPY -->
        <div id="missing-box" class="hidden bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded-xl text-xs font-bold mb-4"></div>

        <!-- TYPY SEZONOWE -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-5 border-t-4 border-yellow-400">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-black text-yellow-800 uppercase text-sm">🏆 Typy sezonowe</h2>
                <span id="lt-status" class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">OTWARTE</span>
            </div>
            <p id="lt-info" class="bg-blue-50 p-2 rounded text-[10px] text-blue-800 font-bold mb-3"></p>
            <div class="space-y-2">
                <div><label class="text-[10px] font-bold text-gray-500 uppercase">🥇 Mistrz Polski</label>
                    <select id="lt-champion" class="w-full p-2 border rounded-lg text-sm font-bold bg-gray-50"></select></div>
                <div><label class="text-[10px] font-bold text-gray-500 uppercase">🥉 Brązowy medal</label>
                    <select id="lt-bronze" class="w-full p-2 border rounded-lg text-sm font-bold bg-gray-50"></select></div>
                <div><label class="text-[10px] font-bold text-gray-500 uppercase">⬇️ Spadek</label>
                    <select id="lt-relegation" class="w-full p-2 border rounded-lg text-sm font-bold bg-gray-50"></select></div>
            </div>
        </div>

        <!-- KOLEJKI -->
        <div id="round-nav" class="flex justify-between items-center mb-4 gap-2"></div>
        <div id="prediction-form" class="space-y-4"></div>

        <!-- MOJE PUNKTY -->
        <div class="mt-8 bg-white p-4 rounded-xl shadow-sm border-t-4 border-blue-500">
            <h2 class="font-black text-blue-900 uppercase text-sm mb-3">📊 Moja forma</h2>
            <div id="my-form" class="text-xs text-gray-600"></div>
        </div>

        <div class="fixed bottom-0 left-0 w-full p-3 bg-white/85 backdrop-blur-md border-t border-gray-200 z-50">
            <div class="max-w-lg mx-auto flex items-center gap-2">
                <span id="save-state" class="text-[10px] font-bold text-gray-400 uppercase w-28 shrink-0">Autozapis wł.</span>
                <button onclick="saveAll()" id="save-btn" class="flex-1 bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all uppercase tracking-widest text-sm">Zapisz moje typy</button>
            </div>
        </div>

        <div id="success-modal" class="fixed inset-0 bg-blue-900/95 hidden flex-col items-center justify-center z-[100] text-white p-10 text-center">
            <div class="text-6xl mb-4">🏁</div>
            <h2 class="text-3xl font-black mb-2">TYPY ZAPISANE!</h2>
            <p id="success-detail" class="opacity-70 mb-8"></p>
            <button onclick="closeModal()" class="bg-white text-blue-900 font-black px-10 py-3 rounded-full uppercase text-sm shadow-2xl">Wróć do typowania</button>
        </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/typuj.js"></script>
</body>
</html>
