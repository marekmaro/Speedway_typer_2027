<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Panel admina — Żużlowy Typer</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0f1c">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/app.css?v=__V__">
</head>
<body class="pb-24 lg:pb-10">
    <div id="busybar" class="fixed top-0 inset-x-0 h-1 z-[120] bg-brand/80 animate-pulse" aria-hidden="true"></div>

    <!-- ===== LOGOWANIE ===== -->
    <div id="login-modal" class="hero fixed inset-0 flex items-center justify-center z-[100] p-4">
        <svg class="hero-track" viewBox="0 0 360 220" fill="none" aria-hidden="true" style="right:auto;left:50%;transform:translateX(-50%);bottom:-40px;width:560px;height:340px">
            <ellipse cx="180" cy="110" rx="170" ry="96" stroke="white" stroke-width="22"/>
            <ellipse cx="180" cy="110" rx="128" ry="58" stroke="white" stroke-width="2" stroke-dasharray="6 8"/>
        </svg>
        <form class="card w-full max-w-sm text-center text-ink overflow-hidden" onsubmit="event.preventDefault(); loginAdmin()">
            <div class="gate-stripe"></div>
            <div class="card-pad">
                <img src="/icons/icon.svg" alt="" class="w-14 h-14 rounded-2xl mx-auto mb-3 shadow-lift">
                <h1 class="display text-2xl">Wieża sędziowska</h1>
                <p class="text-xs text-muted mb-4 mt-1">Panel administratora · hasło sprawdza serwer, sesja wygasa po 8 h bezczynności.</p>
                <label for="admin-pass-input" class="sr-only">Hasło</label>
                <input type="password" id="admin-pass-input" placeholder="Hasło" autocomplete="current-password" class="input text-center mb-3">
                <button class="btn-primary w-full font-black italic uppercase">Wjazd na tor</button>
                <p id="login-error" class="text-sm text-bad font-bold mt-3" role="alert"></p>
                <a href="/" class="inline-block mt-4 text-xs font-bold text-muted">← Strona typera</a>
            </div>
        </form>
    </div>

    <div id="dashboard" class="hidden lg:flex lg:min-h-screen">

        <!-- ===== MENU BOCZNE (komputer) ===== -->
        <aside class="hero hidden lg:flex lg:flex-col w-64 shrink-0 px-3 py-4 sticky top-0 h-screen">
            <div class="flex items-center gap-2 px-2 mb-6">
                <img src="/icons/icon.svg" alt="" class="w-10 h-10 rounded-xl shadow-lift">
                <div><div class="logo-word text-lg">Żużlowy <span>Typer</span></div><div class="text-[11px] text-white/55 font-bold uppercase tracking-wider">Wieża sędziowska</div></div>
            </div>
            <div class="gate-stripe rounded-full mx-2 mb-4"></div>
            <nav class="flex flex-col gap-1" aria-label="Sekcje panelu" id="side-nav"></nav>
            <div class="mt-auto flex flex-col gap-1">
                <a href="/" class="side-link">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Strona typera</a>
                <button data-act="logout" class="side-link">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M12 21H5a2 2 0 01-2-2V5a2 2 0 012-2h7"/></svg>Wyloguj</button>
            </div>
        </aside>

        <div class="flex-1 min-w-0">
            <!-- ===== NAGŁÓWEK ===== -->
            <header class="hero lg:bg-none lg:text-ink sticky top-0 z-30 lg:static" style="padding-top: env(safe-area-inset-top)">
                <div class="mx-auto max-w-4xl px-4 py-3 flex items-center gap-3">
                    <img src="/icons/icon.svg" alt="" class="w-9 h-9 rounded-lg lg:hidden">
                    <div class="min-w-0 flex-1">
                        <h1 id="view-title" class="display text-xl lg:text-3xl truncate">Pulpit</h1>
                        <div class="flex items-center gap-2 text-xs mt-1">
                            <label for="season-picker" class="text-white/60 lg:text-muted">Sezon</label>
                            <select id="season-picker" class="min-w-0 max-w-[12rem] rounded-md px-1.5 py-0.5 font-bold border-0 bg-white/10 text-white lg:bg-raised lg:text-ink lg:border lg:border-line"></select>
                            <span id="season-state" class="chip bg-white/10 text-white/80 lg:bg-raised lg:text-muted hidden sm:inline-flex"></span>
                        </div>
                    </div>
                    <button data-act="refresh" class="btn btn-sm bg-white/10 text-white lg:bg-raised lg:text-ink lg:border lg:border-line" aria-label="Odśwież dane">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>
                    </button>
                </div>
                <div class="gate-stripe lg:hidden"></div>
            </header>

            <main class="mx-auto max-w-4xl px-4 py-4">
                <div id="season-warning" class="hidden mb-4 rounded-2xl border border-warn/40 bg-warn/10 text-warn px-4 py-3 text-sm font-bold"></div>
                <div id="view" aria-live="polite">
                    <div class="skeleton h-28 mb-3"></div><div class="skeleton h-40"></div>
                </div>
            </main>
        </div>

        <!-- ===== DOLNA NAWIGACJA (telefon) ===== -->
        <nav class="tabbar grid-cols-5 md:grid lg:hidden" aria-label="Sekcje panelu" id="tab-nav"></nav>
    </div>

    <script src="/js/shared.js?v=__V__"></script>
    <script src="/js/admin.js?v=__V__"></script>
</body>
</html>
