# Budzi serwer na Render (plan free usypia po 15 min) i odpala zadania w tle:
# przypomnienia push o typach + scraper wyników.
# Ustaw w GitHub -> Settings -> Secrets and variables -> Actions:
#   APP_URL      np. https://zuzlowy-typer.onrender.com
#   CRON_SECRET  ta sama wartość co w Render
name: Zadania typera

on:
  schedule:
    - cron: '*/30 10-22 * 3-10 *'   # co 30 min, 10-22 UTC, marzec-październik (sezon żużlowy)
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obudź serwer i uruchom zadania
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Brak APP_URL / CRON_SECRET - pomijam"; exit 0; fi
          # pierwsze żądanie budzi uśpioną instancję (do ~60 s)
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -m 90 "$APP_URL/healthz"
          curl -fsS -m 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/cron/run?job=all"
